<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F4ECE1"/>
      <stop offset="45%" stop-color="#ECE3D6"/>
      <stop offset="100%" stop-color="#E2D7C7"/>
    </radialGradient>

    <!-- Gold Foil Linear Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E2A8" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#ECC876" />
      <stop offset="100%" stop-color="#B38A28" />
    </linearGradient>

    <!-- Navy Card Radial Gradient -->
    <radialGradient id="navyCardGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1C283A"/>
      <stop offset="70%" stop-color="#141D2B"/>
      <stop offset="100%" stop-color="#0E1520"/>
    </radialGradient>

    <!-- Sleeve Gradient -->
    <radialGradient id="sleeveGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1A2637"/>
      <stop offset="100%" stop-color="#131C28"/>
    </radialGradient>

    <!-- Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#0A101C" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>

    <filter id="debossShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="1.5" />
      <feGaussianBlur stdDeviation="1" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#000000" flood-opacity="0.8" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- ========================================================================= -->
  <!-- 2. LEFT SECTION: LEATHER SLEEVE & INSERT CARD                             -->
  <!-- ========================================================================= -->

  <!-- A. Ivory Insert Card -->
  <g id="Ivory-Insert-Card">
    <rect x="408" y="125" width="384" height="260" rx="28" fill="#F7F2E8" stroke="#DDD4C5" stroke-width="1.5" />
    <text x="600" y="168" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="16" letter-spacing="0.28em" fill="#4A5568" font-weight="500">GUEST KEY CARD</text>
  </g>

  <!-- B. Navy Leather Pocket Sleeve -->
  <g id="Leather-Sleeve" filter="url(#cardShadow)">
    <rect x="365" y="244" width="470" height="696" rx="36" fill="url(#sleeveGrad)" stroke="#243144" stroke-width="2"/>
    
    <!-- Outer dashed stitch border -->
    <rect x="382" y="261" width="436" height="662" rx="26" fill="none" stroke="#2D3F5C" stroke-width="1.8" stroke-dasharray="6,4" stroke-opacity="0.8"/>

    <!-- Top Thumb Notch Cutout -->
    <path d="M 505 244 C 505 320, 695 320, 695 244 Z" fill="#E8DFC2" stroke="#CFC3B0" stroke-width="1.5" />
    <!-- Notch inner shadow overlay -->
    <path d="M 505 244 C 505 320, 695 320, 695 244 Z" fill="#000000" fill-opacity="0.08" />

    <!-- Bottom Debossed HR Monogram -->
    <g id="Sleeve-HR-Debossed" transform="translate(540, 720) scale(0.6)" filter="url(#debossShadow)" opacity="0.85">
      <rect x="12" y="12" width="176" height="276" rx="88" ry="88" stroke="#101622" stroke-width="4.5" fill="none"/>
      <rect x="20" y="20" width="160" height="260" rx="80" ry="80" stroke="#0D121B" stroke-width="2.5" fill="none"/>
      <path d="M 52 110 L 74 110 L 74 114 L 66 114 L 66 186 L 74 186 L 74 190 L 52 190 L 52 186 L 60 186 L 60 114 L 52 114 Z" fill="#0E131E" />
      <path d="M 82 110 L 104 110 L 104 114 L 96 114 L 96 186 L 104 186 L 104 190 L 82 190 L 82 186 L 90 186 L 90 114 L 82 114 Z" fill="#0E131E" />
      <rect x="60" y="147" width="55" height="6" fill="#0E131E" />
      <path d="M 96 110 L 126 110 C 142 110 148 119 148 131 C 148 143 140 152 125 152 L 96 152 L 96 146 L 124 146 C 135 146 141 140 141 131 C 141 122 135 116 124 116 L 96 116 Z" fill="#0E131E" />
      <path d="M 116 150 C 122 150 128 155 132 163 L 144 186 C 146 189 149 190 153 190 L 158 190 L 158 186 C 154 186 150 183 147 178 L 136 157 C 132 150 125 147 116 147 Z" fill="#0E131E" />
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. RIGHT SECTION: GUEST NAME HEADER & RFID SMART CARD                     -->
  <!-- ========================================================================= -->

  <!-- Top "GUEST NAME :" Header Label -->
  <text x="1046" y="145" font-family="'Times New Roman', Georgia, serif" font-size="20" letter-spacing="0.22em" fill="#424F60" font-weight="600">GUEST NAME :</text>

  <!-- RFID Navy Smart Card -->
  <g id="RFID-Smart-Card" filter="url(#cardShadow)">
    <rect x="1046" y="236" width="456" height="704" rx="36" fill="url(#navyCardGrad)" stroke="#26354B" stroke-width="2"/>

    <!-- Gold Foil HR Oval Logo in Card Center -->
    <g id="Card-HR-Gold" transform="translate(1202, 470) scale(0.72)" filter="url(#goldGlow)">
      <rect x="12" y="12" width="176" height="276" rx="88" ry="88" stroke="url(#goldLinear)" stroke-width="3.8" fill="none"/>
      <rect x="20" y="20" width="160" height="260" rx="80" ry="80" stroke="url(#goldLinear)" stroke-width="2.2" stroke-opacity="0.9" fill="none"/>
      <path d="M 52 110 L 74 110 L 74 114 L 66 114 L 66 186 L 74 186 L 74 190 L 52 190 L 52 186 L 60 186 L 60 114 L 52 114 Z" fill="url(#goldLinear)" />
      <path d="M 82 110 L 104 110 L 104 114 L 96 114 L 96 186 L 104 186 L 104 190 L 82 190 L 82 186 L 90 186 L 90 114 L 82 114 Z" fill="url(#goldLinear)" />
      <rect x="60" y="147" width="55" height="6" fill="url(#goldLinear)" />
      <path d="M 96 110 L 126 110 C 142 110 148 119 148 131 C 148 143 140 152 125 152 L 96 152 L 96 146 L 124 146 C 135 146 141 140 141 131 C 141 122 135 116 124 116 L 96 116 Z" fill="url(#goldLinear)" />
      <path d="M 116 150 C 122 150 128 155 132 163 L 144 186 C 146 189 149 190 153 190 L 158 190 L 158 186 C 154 186 150 183 147 178 L 136 157 C 132 150 125 147 116 147 Z" fill="url(#goldLinear)" />
    </g>

    <!-- Hanford Hotel & Resort Subtitle Text (Pre-printed on template) -->
    <text x="1274" y="722" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="15" letter-spacing="0.26em" fill="#D8B468" font-weight="600">HANFORD</text>
    <text x="1274" y="748" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="15" letter-spacing="0.26em" fill="#D8B468" font-weight="600">HOTEL &amp; RESORT</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 4. BOTTOM FOOTER CAPTION                                                  -->
  <!-- ========================================================================= -->
  <text x="960" y="1025" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="16" letter-spacing="0.22em" fill="#334155" font-weight="500">
    HERE IS YOUR ROOM <tspan font-weight="700" fill="#0F172A">GUEST KEY CARD.</tspan>
  </text>
  <text x="960" y="1052" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" letter-spacing="0.16em" fill="#475569">
    ALSO AS ACCESS CARD FOR ELEVATOR AND ANY OTHER FACILITIES
  </text>
</svg>
